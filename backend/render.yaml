# Render "Blueprint" — lets you deploy backend + database together via
# https://dashboard.render.com/blueprints instead of configuring each by hand.
services:
  - type: web
    name: ecommerce-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ecommerce.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set this manually to your deployed frontend URL after it's live

databases:
  - name: ecommerce-db
    plan: free
